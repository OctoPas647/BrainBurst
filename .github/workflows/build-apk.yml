# Builds the BrainBurst APK on every push to main and publishes it as a GitHub Release
# (Releases → BrainBurst <version> → BrainBurst-<version>.apk).
#
# Signing: add ONE repository secret named BRAINBURST_SIGNING
# (Settings → Secrets and variables → Actions → New repository secret) containing the
# base64 text of signing.zip (brainburst.keystore + signing.json). With it, every APK is signed
# with your key, so it installs over the app on your phone and keeps your progress.
# Without it, the build still runs and you can download a test APK from the run's Artifacts,
# but nothing is published, because an APK signed with a temporary key can't update your app.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'apk/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Android SDK platform and build tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-34" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Check content
        run: python3 tools/build.py check

      - name: Restore signing key
        id: key
        env:
          SIGNING: ${{ secrets.BRAINBURST_SIGNING }}
        run: |
          if [ -n "$SIGNING" ]; then
            mkdir -p platforms/android/signing
            echo "$SIGNING" | base64 -d > /tmp/signing.zip
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/signing.zip').extractall('platforms/android/signing')"
            rm /tmp/signing.zip
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No BRAINBURST_SIGNING secret: building a test APK with a temporary key. It won't install over the app on your phone, and no release is published."
          fi

      - name: Build APK
        run: python3 tools/build.py android

      - name: Read version
        id: ver
        run: echo "version=$(python3 -c "import json; print(json.load(open('tools/config.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to this run
        uses: actions/upload-artifact@v6
        with:
          name: BrainBurst-${{ steps.ver.outputs.version }}${{ steps.key.outputs.signed == 'true' && '' || '-test-key' }}
          path: dist/android/*.apk

      - name: Publish release
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VER"
          python3 - <<'PY' > notes.md
          import os, re
          ver = os.environ['VER']
          text = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## ' + re.escape(ver) + r'.*?\n(.*?)(?=^## |\Z)', text, re.S | re.M)
          print((m.group(1).strip() if m else 'BrainBurst ' + ver) + '\n\nDownload the APK below and open it on your phone to install or update.')
          PY
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/android/*.apk --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/android/*.apk --title "BrainBurst $VER" --notes-file notes.md --target "$GITHUB_SHA"
          fi

      - name: Remove signing key
        if: always()
        run: rm -rf platforms/android/signing
